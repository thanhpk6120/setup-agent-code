shellPath: C:\Program Files\Git\bin\bash.exe
symbolPreset: unicode
composer:
  shape: claude
theme:
  dark: titanium
  light: light
setupVersion: 2
modelRoles:
  default: custom/claude-sonnet-5:medium
  smol: custom/claude-sonnet-5:medium
  slow: custom/claude-opus-5:xhigh
  vision: custom/claude-sonnet-5:medium
  plan: custom/claude-opus-5:high
  designer: custom/claude-sonnet-5:medium
  commit: custom/claude-sonnet-5:medium
  tiny: custom/claude-haiku-4-5-20251001
  task: custom/claude-sonnet-5:medium
  advisor: custom/claude-opus-5:xhigh
computer:
  enabled: true
task:
  agentModelOverrides:
    task: custom/claude-opus-5:medium
    scout: custom/claude-sonnet-5:medium
    sonic: custom/claude-sonnet-5:medium
    docs-fact-check: custom/claude-opus-5:high
    docs-reviewer: custom/claude-opus-5:medium
    docs-init: custom/claude-opus-5:medium
    docs-update: custom/claude-opus-5:medium
    docs-reader: custom/claude-sonnet-5:medium
    architect: custom/claude-opus-5:medium
    plan-reviewer: custom/claude-opus-5:medium
    reviewer: custom/claude-opus-5:medium
    security-reviewer: custom/claude-opus-5:high
    dely-implementer: custom/claude-sonnet-5:medium
    dely-reviewer: custom/claude-opus-5:high
  eager: always
  batch: true
  maxConcurrency: 16
  maxRecursionDepth: 2
  agentAdvisor:
    task: "on"
    scout: "on"
    sonic: "on"
    docs-fact-check: "on"
    docs-reviewer: "on"
    docs-init: "on"
    docs-update: "on"
    docs-reader: "on"
    architect: "on"
    plan-reviewer: "on"
    reviewer: "on"
    security-reviewer: "on"
    dely-implementer: "on"
    dely-reviewer: "on"
  agentPrewalk:
    task: "on"
    scout: "on"
    sonic: "on"
    docs-fact-check: "on"
    docs-reviewer: "on"
    docs-init: "on"
    docs-update: "on"
    docs-reader: "on"
    architect: "on"
    plan-reviewer: "on"
    reviewer: "on"
    security-reviewer: "on"
    dely-implementer: "on"
    dely-reviewer: "on"
snapcompact:
  systemPrompt: agents-md,rules-md
dev:
  autoqaConsent: granted
